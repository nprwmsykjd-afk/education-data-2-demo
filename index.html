дения повторно и получать готовую картину по учреждениям.`,points:[`На экране условные организации и данные.`,`После показа можно самостоятельно открыть любой раздел.`]},{eyebrow:`01 · ТОЧКА ВХОДА`,title:`Сохраняем привычный сбор отчётности`,text:`У учреждения остаётся понятный список форм и сроков, у Министерства — охват по каждой форме. Следующий шаг происходит уже внутри отчёта: часть сведений не требуется набирать заново.`,points:[`Пример: сентябрьский и октябрьский мониторинги одной школы.`,`Сведения учитываются только после принятия Министерством.`],anchor:`reports`},{eyebrow:`02 · КОД ПОКАЗАТЕЛЯ`,title:`Один смысл — один код`,text:`В выделенном примере показан код students. В карточке показателя вместе с ним хранятся определение, единица измерения и правило обновления. Формы ссылаются на код, даже если заголовок столбца меняется.`,points:[`Код виден в каталоге и электронном паспорте. В форме школы он доступен через карточку показателя.`,`Количество детей во вторую смену — другой показатель с кодом shift.`],anchor:`indicator-students`},{eyebrow:`03 · СВЯЗЬ ДВУХ ФОРМ`,title:`Названия отличаются, код совпадает`,text:`На экране два столбца из разных форм. Специалист сравнивает, что именно подсчитано, единицу и дату, затем утверждает обе связи с кодом students. Схожие слова сами по себе ничего не переносят.`,points:[`Нажмите «Утвердить две связи» и проверьте, что обе формы указывают на students.`,`Столбец «Количество компьютеров» остаётся неразобранным: смысл неоднозначен.`],anchor:`mapping-bridge`},{eyebrow:`04 · ПОДГОТОВКА ОТЧЁТА`,title:`Форму собираем из известных показателей`,text:`Сотрудник выбирает срок и показатели каталога. Код связывает новый отчёт с уже принятыми сведениями учреждения.`,points:[`В учебной форме цифровой готовности повторяются восемь показателей.`,`Нажмите «Опубликовать форму», чтобы она появилась у учреждения.`],anchor:`constructor`},{eyebrow:`05 · РАБОТА УЧРЕЖДЕНИЯ`,title:`Из 25 полей 20 известны`,text:`Для одной и той же организации система ищет последние принятые значения того же показателя. Она показывает источник и период; сотрудник проверяет актуальность и подтверждает их одним действием либо исправляет.`,points:[`Ключ поиска: ID организации + код показателя + правило периода.`,`Перенос не заменяет подтверждение сотрудника.`],anchor:`form`},{eyebrow:`06 · АКТУАЛИЗАЦИЯ`,title:`Новые данные вводятся один раз`,text:`Пять показателей не встречались в сентябрьской форме — для них нужны новые значения. Месячные итоги за прошлый месяц также не подставляются как результат нового месяца.`,points:[`Проверяются обязательность, допустимые значения и связанные показатели.`,`После отправки сведения ожидают решения Министерства.`],anchor:`form`},{eyebrow:`07 · КОНТРОЛЬ МИНИСТЕРСТВА`,title:`Принятое значение становится общим источником`,text:`Сотрудник Министерства видит статусы организаций, проверяет отчёт и принимает его либо возвращает с замечанием. Сводная аналитика и повторное использование опираются на принятые сведения.`,points:[`Выгрузка в CSV остаётся доступной для привычной работы с таблицами.`,`История принятых значений сохраняется по источнику и периоду.`],anchor:`review`},{eyebrow:`08 · ЭЛЕКТРОННЫЙ ПАСПОРТ`,title:`Отчёты складываются в карточку учреждения`,text:`Паспорт собирает сведения из разных принятых форм по разделам: организация, контингент, условия обучения, цифровая инфраструктура. У каждого значения видны отчётный период и источник.`,points:[`Можно открыть историю показателя и проверить изменение.`,`Архивные отчёты сохраняются за организацией, которая их представила.`],anchor:`passport`},{eyebrow:`09 · УПРАВЛЕНЧЕСКАЯ АНАЛИТИКА`,title:`Сводка показывает и итог, и охват`,text:`Министерство видит показатели сети и переходит к конкретной школе. Если часть организаций ещё не отчиталась, экран прямо показывает неполный охват и не выдаёт пропуск за ноль.`,points:[`Сравнение территорий и детализация доступны по запросу.`,`Это основа для решений, например при планировании оснащения.`],anchor:`analytics`},{eyebrow:`10 · АКТУАЛЬНАЯ СЕТЬ`,title:`Реорганизация не стирает историю`,text:`У школы постоянный ID. В управлении организацией доступны переименование и оформление реорганизации. Прежние отчёты остаются за исходным ID.`,points:[`Правопреемник получает собственную карточку; назначения доступа передаются отдельным действием.`,`После показа можно открыть управление и попробовать эти действия.`],anchor:`organization-admin`},{eyebrow:`11 · ПРИМЕР ИЗ РАБОТЫ`,title:`Еженедельные публикации материалов`,text:`Основа примера — действующая табличная форма с шестью числовыми столбцами. Здесь показана новая неделя: показатели известны системе, но результаты прошлой недели не подставляются как новые.`,points:[`На экране все шесть полей требуют ввода за 11–17 июля.`,`ID учреждения и определения полей остаются прежними; опубликованные числа условные.`],anchor:`form`},{eyebrow:`12 · ДРУГАЯ ПЕРИОДИЧНОСТЬ`,title:`Учебный план на новый год`,text:`Вторая табличная форма содержит предметы × классы и кодирует уровень изучения как 0 или 1. На экране четыре учебные позиции как пример структуры из 70. Значения прошлого учебного года предлагаются для проверки, затем школа подтверждает или исправляет каждую позицию.`,points:[`0 — базовый уровень, 1 — углублённый; другие ответы форма отклоняет.`,`Период и источник видны отдельно. Частоту реального сбора надо уточнить у владельца формы.`],anchor:`form`},{eyebrow:`СЛЕДУЮЩИЙ ШАГ`,title:`Проверить на реальных формах и учреждениях`,text:`Отобрать несколько действующих отчётов, согласовать определения показателей и провести ограниченный пилот. Сравнить подготовку свода до и после доработки, затем решить, какие сведения подключать дальше.`,points:[`Проверяем время заполнения, повторный ввод, ошибки и время подготовки свода.`,`Обмен с ТОР «Моя школа» и помощь ИИ рассматриваются после проверки источников и правил доступа.`]}],Ym=()=>typeof window<`u`&&(window.location.protocol===`file:`||window.__EDU_STANDALONE__===!0),Xm=`mon-lnr-data-2-off
