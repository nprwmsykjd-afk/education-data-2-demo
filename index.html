 обе формы указывают на students.`,`Столбец «Количество компьютеров» остаётся неразобранным: смысл неоднозначен.`],anchor:`mapping-bridge`},{eyebrow:`04 · ПОДГОТОВКА ОТЧЁТА`,title:`Форму собираем из известных показателей`,text:`Сотрудник выбирает срок и показатели каталога. Код связывает новый отчёт с уже принятыми сведениями учреждения.`,points:[`В учебной форме цифровой готовности повторяются восемь показателей.`,`Нажмите «Опубликовать форму», чтобы она появилась у учреждения.`],anchor:`constructor`},{eyebrow:`05 · РАБОТА УЧРЕЖДЕНИЯ`,title:`Из 25 полей 20 известны`,text:`Для одной и той же организации система ищет последние принятые значения того же показателя. Она показывает источник и период; сотрудник проверяет актуальность и подтверждает их одним действием либо исправляет.`,points:[`Ключ поиска: ID организации + код показателя + правило периода.`,`Перенос не заменяет подтверждение сотрудника.`],anchor:`form`},{eyebrow:`06 · АКТУАЛИЗАЦИЯ`,title:`Новые данные вводятся один раз`,text:`Пять показателей не встречались в сентябрьской форме — для них нужны новые значения. Месячные итоги за прошлый месяц также не подставляются как результат нового месяца.`,points:[`Проверяются обязательность, допустимые значения и связанные показатели.`,`После отправки сведения ожидают решения Министерства.`],anchor:`form`},{eyebrow:`07 · КОНТРОЛЬ МИНИСТЕРСТВА`,title:`Принятое значение становится общим источником`,text:`Сотрудник Министерства видит статусы организаций, проверяет отчёт и принимает его либо возвращает с замечанием. Сводная аналитика и повторное использование опираются на принятые сведения.`,points:[`Выгрузка в CSV остаётся доступной для привычной работы с таблицами.`,`История принятых значений сохраняется по источнику и периоду.`],anchor:`review`},{eyebrow:`08 · ЭЛЕКТРОННЫЙ ПАСПОРТ`,title:`Отчёты складываются в карточку учреждения`,text:`Паспорт собирает сведения из разных принятых форм по разделам: организация, контингент, условия обучения, цифровая инфраструктура. У каждого значения видны отчётный период и источник.`,points:[`Можно открыть историю показателя и проверить изменение.`,`Архивные отчёты сохраняются за организацией, которая их представила.`],anchor:`passport`},{eyebrow:`09 · УПРАВЛЕНЧЕСКАЯ АНАЛИТИКА`,title:`Сводка показывает и итог, и охват`,text:`Министерство видит показатели сети и переходит к конкретной школе. Если часть организаций ещё не отчиталась, экран прямо показывает неполный охват и не выдаёт пропуск за ноль.`,points:[`Сравнение территорий и детализация доступны по запросу.`,`Это основа для решений, например при планировании оснащения.`],anchor:`analytics`},{eyebrow:`10 · АКТУАЛЬНАЯ СЕТЬ`,title:`Реорганизация не стирает историю`,text:`У школы постоянный ID. В управлении организацией доступны переименование и оформление реорганизации. Прежние отчёты остаются за исходным ID.`,points:[`Правопреемник получает собственную карточку; назначения доступа передаются отдельным действием.`,`После показа можно открыть управление и попробовать эти действия.`],anchor:`organization-admin`},{eyebrow:`СЛЕДУЮЩИЙ ШАГ`,title:`Проверить на реальных формах и учреждениях`,text:`Отобрать несколько действующих отчётов, согласовать определения показателей и провести ограниченный пилот. Сравнить подготовку свода до и после доработки, затем решить, какие сведения подключать дальше.`,points:[`Проверяем время заполнения, повторный ввод, ошибки и время подготовки свода.`,`Обмен с ТОР «Моя школа» и помощь ИИ рассматриваются после проверки источников и правил доступа.`]}],qm=()=>typeof window<`u`&&(window.location.protocol===`file:`||window.__EDU_STANDALONE__===!0),Jm=`mon-lnr-data-2-offline-v2`,Ym;function Xm(){try{return localStorage.getItem(Jm)}catch{return null}}function Zm(e){Ym=e;try{localStorage.setItem(Jm,JSON.stringify(e))}catch{}}async function Qm(){if(qm()){let e=Xm();if(e)try{let t=JSON.parse(e);return{...t,state:Wm(t.state)}}catch{return{state:Vm(),revision:0}}return Ym||{state:Vm(),revision:0}}let e=await fetch(`/api/workspace
